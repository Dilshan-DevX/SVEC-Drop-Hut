<!DOCTYPE html><html lang='en' class=''>
<head>
<meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Drophut - Search Product eCommerce Template</title>
    <link rel="shortcut icon" type="image/x-icon" href="assets/img/favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
<style class="cp-pen-styles">body {
	padding-top: 30px;
}
.product {
	margin-bottom: 30px;
}
.product-inner {
	box-shadow: 0 0 10px rgba(0,0,0,.2);
	padding: 10px;
}
.product img {
	margin-bottom: 10px;
}</style>

</head>

<body onload="loadData();">

<div class="container">
	<div class="row" id="search">
            <div id="search-form">
                <div class="form-group col-xs-9">
                   <input id="search-text" class="form-control" type="text" placeholder="Search Products..." />
                </div>
                <div class="form-group col-xs-3">
                    <button onclick="searchProduct(0);" class="btn col-12 p-2 btn-primary fs-5"><b>Search</b></button>
                </div>

            </div>
	</div>
	<div class="row" id="filter">
            
		<form>
			<div class="form-group col-sm-3 col-xs-6">
				<select id="brand-options" data-filter="make" class="filter-make filter form-control">
					<option id="brand-li" value="0">Select BRAND</option>
					
				</select>
			</div>
			<div class="form-group col-sm-3 col-xs-6">
				<select id="condition-options"  data-filter="model" class="filter-model filter form-control">
					<option id="condition-li" value="0">Select CONDITION</option>
					
				</select>
			</div>
			<div class="form-group col-sm-3 col-xs-6">
				<select id="color-options" data-filter="type" class="filter-type filter form-control">
					<option id="color-li" value="0">Select COLOR</option>
					
				</select>
			</div>
			<div class="form-group col-sm-3 col-xs-6">
				<select id="storage-options" data-filter="price" class="filter-price filter form-control">
					<option  id="storage-li" value="0">Select Camara</option>
					
				</select>
			</div>
		</form>
	</div>
	<div class="row" id="st-product-container">

        <div class="col-xl-3 col-lg-3 col-md-3 col-sm-6 col-12 mt-4" id="st-product">
            <div class="single-tranding">
        
                <div class="card">
                     <a href="#" id="st-product-a-1">
                         <img id="st-product-img-1" style="height: 300px;" src="assets/img/product/details-1.jpg" class="card-img-top" alt="Product Image"> 
                     </a>
                     
                    <div class="card-body">
                        <h3 class="card-title" id="st-product-title-1">Premium Headphones</h3>
<!--                        <p class="card-text">High-quality wireless headphones with noise cancellation technology.</p>-->
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <span class="h5 mb-0" >Rs .<span id="st-product-price-1">$199.99</span> </span>
                            <div class="rating">
                                ★★★★☆ <small class="text-muted">(4.2)</small>
                            </div>
                        </div>
                        <div class="d-grid gap-2 ">
                            <button id="st-product-a-2" class="btn btn-primary col-12 mb-2" type="button" data-bs-toggle="modal" data-bs-target="#productModal">Quick View</button>
                            <button id="st-product-add-to-cart" class="btn btn-outline-secondary col-12" type="button" id="addToCartBtn">Add to Cart</button>
                        </div>
                    </div>
                </div>        
            </div>         
        </div>
            
        
             

	</div>
    
                        <nav aria-label="Page navigation example" class="col-12 mb-3">
                            <ul id="st-pagination-container" class="pagination pagination-lg allign-items-center justify-content-center">
                                <li class="page-item" ><a  class="page-link"  id="st-pagination-button">Previous</a></li>
                                
                            </ul>
                        </nav>  
    
</div>

    <script src="assets/js/search.js"></script>
</body>

</html>
